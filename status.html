<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Status check – EmulatorJS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="application-name" content="EmulatorJS">
<meta name="msapplication-config" content="browserconfig.xml">
<meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#111418">
    <meta name="description" content="Checks that this browser, the emulator cores and offline mode are ready.">
    <link rel="icon" href="docs/favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EmulatorJS">
    <meta property="og:title" content="Status check – EmulatorJS">
    <meta property="og:description" content="Checks that this browser, the emulator cores and offline mode are ready.">
    <meta property="og:image" content="assets/icons/social-card.png">
    <meta property="og:url" content="">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Status check – EmulatorJS">
    <meta name="twitter:description" content="Checks that this browser, the emulator cores and offline mode are ready.">
    <meta name="twitter:image" content="assets/icons/social-card.png">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="assets/early-view.js"></script>
    <link rel="stylesheet" href="assets/app.css">
    <link rel="stylesheet" href="assets/download.css">
<link rel="stylesheet" href="assets/polish.css">
<noscript><style>.ejs-nojs{display:block!important}</style></noscript>
</head>
<body>
    <main class="dl-page" style="max-width:46rem">
        <a class="button" href="index.html">&#8592; Home</a>
        <h1>Status check</h1>

        <p class="muted">Runs in your browser. Nothing is sent anywhere.</p>
        <section class="card"><ul id="stList" class="dl-list"><li><span class="na">Checking…</span></li></ul></section>
        <p><button class="dl-primary" id="stCopy" type="button">Copy results</button></p>

        <p class="dl-note"><a href="download.html">Get the app</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="about.html">About</a> &middot; <a href="support.html">Help</a> &middot; <a href="status.html">Status</a></p>
    </main>
<script type="module">
const rows = [];
const add = (name, ok, detail) => rows.push({ name, ok, detail });
add("Browser", true, navigator.userAgent.replace(/\s+/g, " ").slice(0, 90));
add("Secure page (https or localhost)", window.isSecureContext, window.isSecureContext ? "yes" : "no: service worker and install need it");
add("Service worker (offline mode)", "serviceWorker" in navigator && !!(await navigator.serviceWorker.getRegistration()), "serviceWorker" in navigator ? ((await navigator.serviceWorker.getRegistration()) ? "active" : "not registered yet; reload once") : "not supported");
add("Threads (PSP, DOS, 3DS)", typeof SharedArrayBuffer === "function" && self.crossOriginIsolated, self.crossOriginIsolated ? "available" : "not available: reload once so the service worker can enable it");
const gl = document.createElement("canvas").getContext("webgl2"); add("WebGL 2", !!gl, gl ? "yes" : "no: older graphics path is used");
add("WebAssembly", typeof WebAssembly === "object", "");
try { const e = await navigator.storage.estimate(); add("Storage", true, Math.round(e.usage / 1e6) + " MB used of about " + Math.round(e.quota / 1e6) + " MB"); } catch (e) { add("Storage", false, "cannot be measured"); }
add("Installed as an app", true, matchMedia("(display-mode: standalone)").matches || navigator.standalone === true ? "yes" : "no (optional)");
try {
  const man = await (await fetch("data/cores/manifest.json", { cache: "no-cache" })).json();
  const cores = [...new Set(Object.keys(man.files).map((f) => f.replace(/(-thread)?(-legacy)?-wasm\.7z$/, "")))];
  let have = 0, missing = [];
  await Promise.all(cores.map(async (c) => { try { const r = await fetch("data/cores/" + c + "-legacy-wasm.7z", { method: "HEAD" }); (r.ok ? have++ : missing.push(c)); } catch (e) { missing.push(c); } }));
  add("Emulator cores present", have > 0 && !missing.length, have + " of " + cores.length + (missing.length ? "; missing: " + missing.sort().slice(0, 8).join(", ") + (missing.length > 8 ? "…" : "") : ""));
} catch (e) { add("Emulator cores present", false, "core list not found"); }
try { const h = await (await fetch("homebrew/index.json")).json(); add("Bundled games", h.games.length > 0, h.games.length + " homebrew games"); } catch (e) { add("Bundled games", false, "list not found"); }
document.getElementById("stList").innerHTML = rows.map((r) => `<li><span class="${r.ok ? "ok" : "na"}"><span>${r.ok ? "✔" : "✖"} ${r.name}</span><em>${r.detail}</em></span></li>`).join("");
document.getElementById("stCopy").onclick = () => navigator.clipboard.writeText(rows.map((r) => (r.ok ? "OK   " : "FAIL ") + r.name + ": " + r.detail).join("\n"));
</script>
<noscript><p class="ejs-warnbar">This site needs JavaScript to run the emulators. Please turn it on.</p></noscript>
<script src="assets/polish.js" defer></script>
</body>
</html>
