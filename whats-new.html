        <p class="dl-note"><a href="download.html">Get the app</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="about.html">About</a> &middot; <a href="support.html">Help</a> &middot; <a href="status.html">Status</a></p>
    </main>
<script>
fetch("CHANGES.md").then(function (r) { return r.text(); }).then(function (t) {
  var esc = function (s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  var inl = function (s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); };
  var out = "", cards = 0, list = false;
  t.split(/\r?\n/).forEach(function (l) {
    var h = l.match(/^(#{1,3}) (.*)/);
    if (list && !/^[-*] /.test(l)) { out += "</ul>"; list = false; }
    if (h && h[1] === "#" && /4\.3\.0-local/.test(h[2])) { if (cards) out += "</section>"; cards++; out += '<section class="card"><h2>' + inl(h[2]) + "</h2>"; }
    else if (h) out += "<h3>" + inl(h[2]) + "</h3>";
    else if (/^[-*] /.test(l)) { if (!list) { out += "<ul>"; list = true; } out += "<li>" + inl(l.slice(2)) + "</li>"; }
    else if (l.trim()) out += "<p>" + inl(l) + "</p>";
  });
  if (list) out += "</ul>"; if (cards) out += "</section>";
  document.getElementById("wnBody").innerHTML = out; document.getElementById("wnState").textContent = cards + " releases";
}).catch(function () { document.getElementById("wnState").textContent = "Release notes are not available offline yet."; });
</script>
<noscript><p class="ejs-warnbar">This site needs JavaScript to run the emulators. Please turn it on.</p></noscript>
<script src="assets/polish.js" defer></script>
